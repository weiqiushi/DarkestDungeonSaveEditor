name: build

on:
  workflow_dispatch:

jobs:
  rust:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.93.1
        override: true
        profile: minimal
    - name: Build
      run: |
        cd rust/ddsaveedit
        cargo build --release
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: DDSaveEditor
        path: rust/ddsaveedit/target/release/ddsaveedit.exe

  java:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Install Java
      uses: actions/setup-java@v1
      with:
        java-version: '8'
        java-package: jdk
    - name: Test
      run: |
        ./gradlew test
    - name: Build distribution zip
      run: |
        ./gradlew dist
    - name: Upload distribution zip
      uses: actions/upload-artifact@v4
      with:
        name: DDSaveEditor
        path: build/dist/
